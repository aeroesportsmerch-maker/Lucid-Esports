<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewz Merch</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0b0b0b;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 8%;
background:#111;
position:sticky;
top:0;
}

.logo{
font-size:32px;
font-weight:700;
color:#a855f7;
}

nav a{
margin-left:25px;
text-decoration:none;
color:white;
transition:.3s;
}

nav a:hover{
color:#a855f7;
}

.hero{
height:80vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8)),
url("https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1400&q=80");
background-size:cover;
background-position:center;
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
opacity:.8;
margin-bottom:35px;
}

.btn{
padding:15px 40px;
background:#a855f7;
border:none;
border-radius:8px;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

.btn:hover{
background:#9333ea;
}

.products{
padding:80px 8%;
}

.products h2{
text-align:center;
margin-bottom:50px;
font-size:42px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:35px;
}

.card{
background:#181818;
border-radius:12px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.info{
padding:20px;
}

.price{
font-size:24px;
color:#a855f7;
margin:15px 0;
}

button{
width:100%;
padding:15px;
background:#a855f7;
border:none;
color:white;
font-size:17px;
cursor:pointer;
}

.cart{
position:fixed;
right:20px;
bottom:20px;
background:#a855f7;
padding:15px 20px;
border-radius:50px;
font-weight:bold;
cursor:pointer;
}

footer{
padding:40px;
text-align:center;
background:#111;
margin-top:80px;
}

</style>

</head>

<body>

<header>

<div class="logo">VIEWZ</div>

<nav>
<a href="#">Home</a>
<a href="#shop">Shop</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<h1>VIEWZ MERCH</h1>

<p>Official Apparel & Accessories</p>

<a href="#shop">
<button class="btn">
Shop Now
</button>
</a>

</section>

<section class="products" id="shop">

<h2>Featured Products</h2>

<div class="grid">

<div class="card">

<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80">

<div class="info">

<h3>Viewz Hoodie</h3>

<div class="price">$45</div>

<button onclick="addCart(45)">
Add To Cart
</button>

</div>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=800&q=80">

<div class="info">

<h3>Viewz Tee</h3>

<div class="price">$30</div>

<button onclick="addCart(30)">
Add To Cart
</button>

</div>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80">

<div class="info">

<h3>Viewz Hat</h3>

<div class="price">$25</div>

<button onclick="addCart(25)">
Add To Cart
</button>

</div>

</div>

</div>

</section>

<div class="cart">
🛒 Cart: $<span id="total">0</span>
</div>

<footer>

© 2026 Viewz. All Rights Reserved.

</footer>

<script>

let total=0;

function addCart(price){

total+=price;

document.getElementById("total").innerHTML=total;

}

</script>

</body>
</html>
